name: "Publish images"

# Workflow autonomo: costruisce e pubblica le immagini del modulo senza
# dipendere da workflow riutilizzabili di altre organizzazioni.

on:
  push:
    branches: [main]
    tags: ["*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  publish:
    name: Build e pubblicazione immagini
    runs-on: ubuntu-24.04
    env:
      REPOBASE: ghcr.io/${{ github.repository_owner }}
      IMAGETAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Build delle immagini
        id: build
        run: |
          export REPOBASE="${REPOBASE,,}"
          export IMAGETAG="${IMAGETAG//\//-}"
          echo "IMAGETAG=${IMAGETAG}" >> "$GITHUB_ENV"
          bash build-images.sh

      - name: Pubblicazione su ghcr.io
        run: |
          trap 'buildah logout ghcr.io' EXIT
          buildah login -u "${{ github.actor }}" --password-stdin ghcr.io <<<"${{ secrets.GITHUB_TOKEN }}"
          for image in ${{ steps.build.outputs.images }}; do
            buildah push "$image" "docker://${image}:${IMAGETAG}"
            if [ "${IMAGETAG}" = "main" ]; then
              buildah push "$image" "docker://${image}:latest"
            fi
            echo "::notice title=Immagine pubblicata::${image}:${IMAGETAG}"
          done
