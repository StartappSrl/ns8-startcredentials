# Compila l'APK dell'app Android su GitHub: dalla scheda Actions ("Run workflow")
# oppure creando un tag che inizia con "app-" (es. app-0.8.0).
# Per firmare con la chiave aziendale servono i segreti del repository:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Senza segreti l'APK è firmato con la chiave di prova del modello React Native:
# va bene solo per le prove.
name: App Android (APK)

on:
  workflow_dispatch:
  push:
    tags: ["app-*"]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: SDK Android
        uses: android-actions/setup-android@v3

      - name: Pacchetti condivisi e motore crittografico
        run: |
          npm ci
          npm run build -w packages/crypto -w packages/client
          node mobile/scripts/build-engine.mjs

      - name: Dipendenze dell'app
        working-directory: mobile
        run: npm ci

      - name: Controllo dei tipi
        working-directory: mobile
        run: npx tsc --noEmit

      - name: Progetto Android
        working-directory: mobile
        run: npx expo prebuild -p android --no-install --clean

      - name: Chiave di firma
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Firma della build di release
        working-directory: mobile
        run: node scripts/configure-signing.mjs

      - name: Compilazione dell'APK
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Nome del file
        id: name
        run: echo "file=StartCredentials-$(node -p "require('./mobile/app.json').expo.version").apk" >> "$GITHUB_OUTPUT"

      - name: Rinomina
        run: cp mobile/android/app/build/outputs/apk/release/app-release.apk "${{ steps.name.outputs.file }}"

      - uses: actions/upload-artifact@v4
        with:
          name: StartCredentials-APK
          path: ${{ steps.name.outputs.file }}
          retention-days: 30
